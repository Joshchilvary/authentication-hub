{% extends "base.html" %}

{% block title %}
Check your email | Authentication Hub
{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="page-header" style="text-align: center;">
            <div style="font-size: 3rem; margin-bottom: var(--spacing-md);">&#x2709;&#xFE0F;</div>
            <h1>Check your email</h1>
            <p class="auth-subtitle">If an account exists for the email address you entered, we have sent password-reset instructions.</p>
        </div>

        <div class="auth-redirect">
            <a href="{% url 'accounts:login' %}">Back to Login</a>
        </div>
    </div>
</section>
{% endblock %}
