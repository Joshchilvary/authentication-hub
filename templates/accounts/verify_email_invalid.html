{% extends "base.html" %}

{% block title %}
Invalid Verification Link | Authentication Hub
{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-header" style="text-align: center;">
            <div style="font-size: 3rem; margin-bottom: var(--spacing-md);">&#x26A0;&#xFE0F;</div>
            <h1>Invalid or Expired Link</h1>
            <p class="auth-subtitle">The verification link is invalid or has expired.</p>
        </div>

        <div class="auth-redirect">
            <a href="{% url 'accounts:resend_verification' %}">Resend Verification Email</a>
        </div>
    </div>
</section>
{% endblock %}
