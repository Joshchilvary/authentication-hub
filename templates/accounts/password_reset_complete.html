{% extends "base.html" %}

{% block title %}
Password reset complete | Authentication Hub
{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="page-header" style="text-align: center;">
            <div style="font-size: 3rem; margin-bottom: var(--spacing-md);">&#x2705;</div>
            <h1>Your password has been reset successfully.</h1>
            <p class="auth-subtitle">You can now log in with your new password.</p>
        </div>

        <div class="auth-redirect">
            <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block">Log In</a>
        </div>
    </div>
</section>
{% endblock %}
